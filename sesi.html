<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backdrop Sesi - BKPO KKM 2026</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/sesi.css">
</head>
<body>
  <div id="stage">
    <div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
    <div class="grid"></div>
    <div class="horizon"></div>
    <div class="scan"></div>

    <header class="topbar">
      <div class="brand">
        <div class="crest"><img src="assets/jata.png" alt="Jata Negara"></div>
        <div class="brand-text">KEMENTERIAN KESIHATAN MALAYSIA</div>
      </div>
      <div class="clock">
        <div id="clockTime">--:--:--</div>
        <div id="clockDate">&nbsp;</div>
      </div>
    </header>

    <section class="hero">
      <h1><span>BENGKEL KAJIAN PENILAIAN</span> <em>OUTCOME</em></h1>
      <div class="ribbon"><span>KEMENTERIAN KESIHATAN MALAYSIA TAHUN 2026</span></div>
      <div class="pills">
        <div class="pill"><i class="ico cal"></i><b>18 - 20 NOVEMBER 2026</b><small>(RABU - JUMAAT)</small></div>
        <div class="pill"><i class="ico pin"></i><b>CONCORDE HOTEL, SHAH ALAM</b></div>
      </div>
    </section>

    <main class="main">
      <section class="now" id="nowCard">
        <div class="now-label"><span class="pulse"></span><span id="nowLabel">SEDANG BERLANGSUNG</span></div>
        <div class="now-body" id="nowBody">
          <div class="now-tag" id="nowTag"></div>
          <h2 id="nowTitle"></h2>
          <div class="now-speaker" id="nowSpeaker"></div>
          <div class="now-time" id="nowTime"></div>
        </div>
        <div class="now-foot">
          <div class="bar" id="barWrap"><div class="fill" id="barFill"></div><div class="glint"></div></div>
          <div class="remain"><span id="remainLabel"></span><b id="remainValue"></b></div>
          <div class="next" id="nextLine"></div>
        </div>
      </section>

      <aside class="agenda">
        <div class="agenda-head">
          <div id="dayTitle">ATUR CARA</div>
          <div class="day-dots" id="dayDots"></div>
        </div>
        <div class="agenda-list" id="agendaList"></div>
      </aside>
    </main>

    <footer class="ticker">
      <div class="ticker-tag">MAKLUMAN</div>
      <div class="ticker-wrap"><div class="ticker-move" id="tickerMove"></div></div>
    </footer>

    <div id="demoBadge" class="demo-badge" hidden>MOD DEMO</div>
    <a class="navbtn nav-back" id="navBtn" href="index.html" title="Halaman utama (M)" aria-label="Kembali ke halaman utama">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="vignette"></div>
  </div>

  <script src="js/fx.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
