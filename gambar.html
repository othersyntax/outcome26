<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeri Bengkel - BKPO KKM 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #02000b; color: #f3f6ff; overflow: hidden;
    font-family: "Montserrat", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
  .slide.on { opacity: 1; }
  .slide .bg { position: absolute; inset: -5%; background-size: cover; background-position: center; filter: blur(40px) brightness(.45); }
  .slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .slide.on img { animation: zoom 8s ease-out forwards; }
  @keyframes zoom { from { transform: scale(1); } to { transform: scale(1.06); } }
  .bar { position: fixed; left: 0; bottom: 0; height: 5px; width: 0; background: linear-gradient(90deg, #22e6ff, #a259ff, #ff3ea5); z-index: 5; }
  .ctrl { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
    padding: 8px 14px; border-radius: 40px; background: rgba(8,3,32,.65); backdrop-filter: blur(8px); z-index: 5;
    transition: opacity .4s; }
  .ctrl.hide { opacity: 0; pointer-events: none; }
  .ctrl button { background: none; border: 1px solid rgba(255,255,255,.3); color: #fff; width: 42px; height: 42px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .ctrl button:hover { background: rgba(34,230,255,.25); }
  .ctrl span { min-width: 60px; text-align: center; font-size: 14px; }
  #start { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; gap: 22px; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(ellipse at 50% 38%, #150a46 0%, #080320 55%, #02000b 100%); }
  #start h1 { font-size: clamp(24px, 4vw, 48px); letter-spacing: 2px; }
  #start small { color: #b6f6ff; letter-spacing: 3px; }
  #start button { font: inherit; font-weight: 700; font-size: 20px; padding: 16px 44px; border: 0; border-radius: 40px; cursor: pointer; color: #02000b;
    background: linear-gradient(90deg, #22e6ff, #a259ff); }
  body.playing { cursor: none; }
  body.playing .ctrl:hover { cursor: default; }
</style>
</head>
<body>
  <div id="start">
    <small>BENGKEL KAJIAN PENILAIAN OUTCOME KKM 2026</small>
    <h1>Galeri Bengkel</h1>
    <button id="go">&#9654; Mula Tayangan</button>
  </div>

  <div id="slides"></div>
  <div class="bar" id="bar"></div>
  <div class="ctrl hide" id="ctrl">
    <button id="prev" title="Sebelum">&#9664;</button>
    <button id="pp" title="Jeda / Main">&#10073;&#10073;</button>
    <button id="next" title="Seterusnya">&#9654;</button>
    <span id="cnt"></span>
    <button id="mute" title="Bunyi">&#128266;</button>
    <button id="fs" title="Skrin penuh">&#9974;</button>
  </div>
  <audio id="bgm" src="assets/luar-biasa.mp3" loop preload="auto"></audio>

<script>
(function () {
  var COUNT = 17, INTERVAL = 6000;
  var slidesEl = document.getElementById('slides'), bar = document.getElementById('bar');
  var ctrl = document.getElementById('ctrl'), cnt = document.getElementById('cnt');
  var bgm = document.getElementById('bgm'), pp = document.getElementById('pp');
  var slides = [], cur = -1, timer = null, playing = false, hideT = null;

  for (var i = 1; i <= COUNT; i++) {
    var src = 'assets/gambar/' + (i < 10 ? '0' : '') + i + '.jpeg';
    var d = document.createElement('div'); d.className = 'slide';
    d.innerHTML = '<div class="bg" style="background-image:url(\'' + src + '\')"></div><img alt="Gambar ' + i + '" src="' + src + '">';
    slidesEl.appendChild(d); slides.push(d);
  }

  function restartBar() {
    bar.style.transition = 'none'; bar.style.width = '0';
    if (!playing) return;
    void bar.offsetWidth;
    bar.style.transition = 'width ' + INTERVAL + 'ms linear'; bar.style.width = '100%';
  }
  function show(n) {
    n = (n + COUNT) % COUNT;
    if (cur >= 0) slides[cur].classList.remove('on');
    cur = n;
    var s = slides[n]; var im = s.querySelector('img');
    im.style.animation = 'none'; void im.offsetWidth; im.style.animation = '';
    s.classList.add('on');
    cnt.textContent = (n + 1) + ' / ' + COUNT;
    clearTimeout(timer);
    restartBar();
    if (playing) timer = setTimeout(function () { show(cur + 1); }, INTERVAL);
  }
  function setPlaying(p) {
    playing = p; pp.innerHTML = p ? '&#10073;&#10073;' : '&#9654;';
    if (p) bgm.play().catch(function () {}); else bgm.pause();
    show(cur);
  }
  function wake() {
    ctrl.classList.remove('hide'); document.body.style.cursor = 'default';
    clearTimeout(hideT);
    hideT = setTimeout(function () { ctrl.classList.add('hide'); document.body.style.cursor = 'none'; }, 3000);
  }

  document.getElementById('go').onclick = function () {
    document.getElementById('start').style.display = 'none';
    bgm.volume = 0.8; playing = true; pp.innerHTML = '&#10073;&#10073;';
    bgm.play().catch(function () {});
    show(0); wake();
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
  };
  document.getElementById('prev').onclick = function () { show(cur - 1); };
  document.getElementById('next').onclick = function () { show(cur + 1); };
  pp.onclick = function () { setPlaying(!playing); };
  document.getElementById('mute').onclick = function (e) { bgm.muted = !bgm.muted; e.target.innerHTML = bgm.muted ? '&#128263;' : '&#128266;'; };
  document.getElementById('fs').onclick = function () {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
  };
  document.addEventListener('mousemove', wake);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') show(cur + 1);
    else if (e.key === 'ArrowLeft') show(cur - 1);
    else if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === 'm' || e.key === 'M') document.getElementById('mute').click();
    else if (e.key === 'f' || e.key === 'F') document.getElementById('fs').click();
    wake();
  });
})();
</script>
</body>
</html>
