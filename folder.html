<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folder Bengkel - BKPO KKM 2026</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/folder.css">
</head>
<body class="with-qr">
  <div id="stage">
    <div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
    <div class="grid"></div>
    <div class="horizon"></div>
    <div class="scan"></div>

    <!-- Cincin HUD berputar di belakang tajuk -->
    <svg class="rings" viewBox="-500 -500 1000 1000" aria-hidden="true">
      <defs>
        <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#22e6ff"/><stop offset=".5" stop-color="#a259ff"/><stop offset="1" stop-color="#ff3ea5"/>
        </linearGradient>
      </defs>
      <g class="r r1"><circle r="470" fill="none" stroke="url(#rg)" stroke-width="3" stroke-dasharray="2 18"/></g>
      <g class="r r2"><circle r="420" fill="none" stroke="url(#rg)" stroke-width="2" stroke-dasharray="180 60 20 60"/></g>
      <g class="r r3"><circle r="360" fill="none" stroke="#22e6ff" stroke-width="1.5" stroke-opacity=".7" stroke-dasharray="6 10"/></g>
      <g class="r r4"><path d="M -440 0 A 440 440 0 0 1 0 -440" fill="none" stroke="#22e6ff" stroke-width="8" stroke-linecap="round"/><path d="M 440 0 A 440 440 0 0 1 0 440" fill="none" stroke="#ff3ea5" stroke-width="8" stroke-linecap="round"/></g>
    </svg>

    <aside class="qr-panel">
      <div class="qr-tag">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        <span>FOLDER BENGKEL</span>
      </div>
      <div class="qr-card">
        <img src="assets/qr-folder.jpeg" alt="QR Code Folder Bengkel">
        <i class="qc tl"></i><i class="qc tr"></i><i class="qc bl"></i><i class="qc br"></i>
        <div class="qr-scan"></div>
      </div>
      <div class="qr-cap">IMBAS UNTUK AKSES FOLDER</div>
    </aside>

    <div class="crest-top"><img src="assets/jata.png" alt="Jata Negara"></div>

    <main class="center" id="center">
      <h1 class="title">
        <span class="t1" id="t1">BENGKEL KAJIAN PENILAIAN</span>
        <span class="t2" id="t2">OUTCOME</span>
      </h1>

      <div class="sub"><span>KEMENTERIAN KESIHATAN MALAYSIA TAHUN 2026</span></div>

      <div class="chips">
        <div class="chip c1">
          <i class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></i>
          <div><b>18 - 20 NOVEMBER 2026</b><small>RABU - JUMAAT</small></div>
        </div>
        <div class="chip c2">
          <i class="ico"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></i>
          <div><b>CONCORDE HOTEL, SHAH ALAM</b></div>
        </div>
      </div>
    </main>

    <a class="navbtn nav-home" id="navBtn" href="index.html" title="Halaman utama (M)" aria-label="Kembali ke halaman utama">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="vignette"></div>
  </div>

  <script src="js/fx.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
